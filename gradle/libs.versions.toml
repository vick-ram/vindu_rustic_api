[versions]
kotlin = "2.4.0"
exposed = "1.0.0"
ktor = "3.5.0"
flyway = "11.9.1"
postgres = "42.7.11"
r2-postgresql = "1.1.1.RELEASE"
pool = "1.0.2.RELEASE"
migration = "1.3.0"
logback = "1.5.34"
koin = "4.2.2"
lattuce = "7.6.0.RELEASE"
thymeleaf = "3.4.0"
jakarta = "2.0.2"
locator = "0.50"
kotest = "6.0.0.M4"
firebase-admin = "9.9.0"
skiko = "0.9.22"
coroutines-reactive = "1.11.0"
feather = "4.29.2"
tabler = "1.35.0"
swagger = "2.2.49"
pesapal-client = "v1.0.3"
sns = "2.21.0"
bcrypt = "0.10.2"
ksp = "2.3.9"

[libraries]
#Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-host-common = { module = "io.ktor:ktor-server-host-common", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-sessions = { module = "io.ktor:ktor-server-sessions", version.ref = "ktor" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-hsts = { module = "io.ktor:ktor-server-hsts", version.ref = "ktor" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-kotlinx-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-properties = { module = "org.jetbrains.kotlinx:kotlinx-serialization-properties", version = "1.11.0" }
ktor-swagger-ui = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
swagger-core = { module = "io.swagger.core.v3:swagger-core", version.ref = "swagger" }
pesapal-kotlin-client = { module = "com.github.vick-ram:pesapal-kotlin-client", version.ref = "pesapal-client" }

#Ktor client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

#Exposed
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }

#webjars
ktor-server-webjars = { module = "io.ktor:ktor-server-webjars", version.ref = "ktor" }
ktor-server-thymeleaf = { module = "io.ktor:ktor-server-thymeleaf", version.ref = "ktor" }
webjars-locator-core = { module = "org.webjars:webjars-locator-core", version.ref = "locator" }
thymeleaf-layout-dialect = { module = "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect", version.ref = "thymeleaf" }
feather = { module = "org.webjars.npm:feather-icons", version.ref = "feather" }
tabler = { module = "org.webjars.npm:tabler-icons", version.ref = "tabler" }

#Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }

#Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }
r2dbc = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2-postgresql" }
postgresql-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "pool" }

#Migrations
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
exposed-migration-core = { module = "org.jetbrains.exposed:exposed-migration-core", version.ref = "migration" }
exposed-migration-r2 = { module = "org.jetbrains.exposed:exposed-migration-r2dbc", version.ref = "migration" }

#Redis
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "coroutines-reactive" }
lattuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lattuce" }

#Mail
jakarta-mail = { module = "com.sun.mail:jakarta.mail", version.ref = "jakarta" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
sns-client = { module = "software.amazon.awssdk:sns", version.ref = "sns" }

#DI
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertion = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
ktor-kotest-assertion = { module = "io.kotest.extensions:kotest-assertions-ktor", version.ref = "kotest" }

# Image processing
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }

bcrypt-hashing = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
