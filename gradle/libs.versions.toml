[versions]
kotlin = "2.2.0"
exposed = "1.0.0-beta-5"
ktor = "3.1.3"
hikariCp = "5.1.0"
flyway = "11.9.1"
postgresql = "42.7.7"
logback = "1.5.19"
koin = "4.1.0"
lattuce = "6.7.1.RELEASE"
thymeleaf = "3.4.0"
jakarta = "2.0.1"
locator = "0.50"
kotest = "6.0.0.M4"
firebase-admin = "9.9.0"
skiko = "0.9.22"
coroutines-reactive = "1.10.2"
feather = "4.29.2"
tabler = "1.35.0"
swagger = "2.2.38"
pesapal-client = "v1.0.3"
jackson = "2.15.2"
sns = "2.21.0"

[libraries]
#Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-host-common = { module = "io.ktor:ktor-server-host-common", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-sessions = { module = "io.ktor:ktor-server-sessions", version.ref = "ktor" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-serialization-gson = { module = "io.ktor:ktor-serialization-gson", version.ref = "ktor" }
ktor-swagger-ui = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
swagger-core = { module = "io.swagger.core.v3:swagger-core", version.ref = "swagger" }
pesapal-kotlin-client = { module = "com.github.vick-ram:pesapal-kotlin-client", version.ref = "pesapal-client" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

#Ktor client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

#Exposed
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }

#webjars
ktor-server-webjars = { module = "io.ktor:ktor-server-webjars", version.ref = "ktor" }
ktor-server-thymeleaf = { module = "io.ktor:ktor-server-thymeleaf", version.ref = "ktor" }
webjars-locator-core = { module = "org.webjars:webjars-locator-core", version.ref = "locator" }
thymeleaf-layout-dialect = { module = "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect", version.ref = "thymeleaf" }
feather = { module = "org.webjars.npm:feather-icons", version.ref = "feather" }
tabler = { module = "org.webjars.npm:tabler-icons", version.ref = "tabler" }

#Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }

#Database
hikariCp = { module = "com.zaxxer:HikariCP", version.ref = "hikariCp" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

#Migrations
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
exposed-migration = { module = "org.jetbrains.exposed:exposed-migration", version.ref = "exposed" }

#Redis
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "coroutines-reactive" }
lattuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lattuce" }

#Mail
jakarta-mail = { module = "com.sun.mail:jakarta.mail", version.ref = "jakarta" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
sns-client = { module = "software.amazon.awssdk:sns", version.ref = "sns" }

#DI
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertion = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
ktor-kotest-assertion = { module = "io.kotest.extensions:kotest-assertions-ktor", version.ref = "kotest" }

# Image processing
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
