ktor:
  application:
    modules:
      - org.example.AppKt.module
  deployment:
    port: 9000
    watch:
      - classes
      - resources
  serverPort: $PORT
  logLevel: $LOG_LEVEL
  development: true
  redis:
    host: localhost
    port: 6379
    database: 0

cors:
  allowedHosts:
    - "*"
  allowedMethods:
    - POST
    - GET
    - OPTIONS
    - DELETE
    - PUT
    - PATCH
  allowedHeaders:
    - "*"
  allowCredentials: true
  maxAge: 3600

jwt:
  secret: $JWT_SECRET
  domain: $JWT_DOMAIN
  audience: $JWT_AUDIENCE
  realm: $JWT_REALM
  issuer: $JWT_ISSUER

session:
  encryptionKey: $SESSION_SECRET_ENCRYPTION_KEY
  signKey: $SESSION_SECRET_SIGN_IN

database:
  port: $DB_PORT
  driver: $DB_DRIVER
  db: $DATABASE
  user: $DB_USER
  password: $DB_PASSWORD
  poolSize: 10
  connectionTimeout: 30000
  idleTimeout: 600000
  maxLifetime: 1800000
  minimumIdle: 5
  leakDetectionThreshold: 60000
  cachePrepStmts: true
  prepStmtCacheSize: 250
  prepStmtCacheSqlLimit: 2048
  useServerPrepStmts: false
  runMigrations: false

pesapal:
  baseUrl: $PESAPAL_BASE_URL
  consumerKey: $PESAPAL_CONSUMER_KEY
  consumerSecret: $PESAPAL_CONSUMER_SECRET
  ipnUrl: $PESAPAL_IPN_URL
  callbackUrl: $PESAPAL_CALLBACK_URL
  cancellationUrl: $PESAPAL_CANCELLATION_URL
google:
  clientID: $GOOGLE_CLIENT_ID
  clientSecret: $GOOGLE_CLIENT_SECRET
email:
  fromEmail: $SMTP_FROM_EMAIL
  host: $SMTP_HOST
  port: $SMTP_PORT
  username: $SMTP_USERNAME
  password: $SMTP_PASSWORD
  debug: false
  timeouts:
    connection: 5000
    read: 5000
    write: 5000
fcm:
  credentialPath: $FCM_CREDENTIAL_PATH
  projectId: $FCM_PROJECT_ID

sms:
  accessKey: $SMS_ACCESS_KEY
  secretKey: $SMS_SECRET_KEY
  region: $SMS_REGION


