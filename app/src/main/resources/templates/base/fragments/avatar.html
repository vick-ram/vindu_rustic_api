<div th:fragment="avatar(id, imageUrl, menu)" class="menu-wrapper relative" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="avatar">
        <img th:src="${imageUrl}" alt="User Avatar" class="avatar-img" th:attr="data-menu-id=${id}"
             onclick="toggleMenu(this)">
    </div>
    <div th:if="${menu != null}" th:insert="${menu}"></div>
</div>
