<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{customer/layouts/auth.html}">
<head>
    <meta charset="UTF-8">
    <title>Welcome Back!</title>
</head>
<body>
<div layout:fragment="auth-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <!-- Welcome Header -->
                        <div class="text-center mb-5">
                            <h2 class="fw-bold text-primary">Welcome Back!</h2>
                            <p class="text-muted">Sign in to continue your journey with us</p>
                        </div>

                        <!-- Login Form -->
                        <form method="post" th:action="@{/signin}">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email or Username</label>
                                <input type="text" class="form-control py-2" id="username" name="username"
                                       placeholder="Enter your email or username">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control py-2" id="password" name="password"
                                       placeholder="Enter your password">
                                <div class="text-end mt-2">
                                    <a href="#" class="text-decoration-none small">Forgot password?</a>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                                Sign In
                            </button>
                        </form>

                        <!-- Divider -->
                        <div class="position-relative my-4">
                            <hr>
                            <div class="position-absolute top-50 start-50 translate-middle bg-white px-3">OR</div>
                        </div>

                        <div class="social-login">
                            <a href="#" class="social-icon" title="Login with Google">
                                <i class="fab fa-google"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Facebook">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Twitter">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Apple">
                                <i class="fab fa-apple"></i>
                            </a>
                        </div>

                        <!-- Sign Up Link -->
                        <div class="text-center mt-4">
                            <p class="text-muted">Don't have an account?
                                <a th:href="@{/signup}" class="text-primary fw-bold text-decoration-none">Create one</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
    }

    .card {
        border: none;
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .btn-primary {
        background: linear-gradient(45deg, #3a7bd5, #00d2ff);
        border: none;
    }

    .text-primary {
        color: #3a7bd5 !important;
    }
</style>
</body>
</html>
