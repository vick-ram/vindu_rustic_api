<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(currentPage)" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <i data-feather="home"></i>
        </div>
        <div class="sidebar-title">Vindu Rustic</div>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" th:class="${currentPage == 'dashboard'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="grid"></i></div>
            <div class="nav-text">Dashboard</div>
        </a>

        <h6 class="section-title mt-3">Config</h6>

        <a th:href="@{/admin/users}" th:class="${currentPage == 'users'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="users"></i></div>
            <div class="nav-text">Users</div>
        </a>
        <a th:href="@{/admin/products}" th:class="${currentPage == 'products'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="shopping-bag"></i></div>
            <div class="nav-text">Products</div>
        </a>
        <a th:href="@{/admin/orders}" th:class="${currentPage == 'orders'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="shopping-cart"></i></div>
            <div class="nav-text">Orders</div>
        </a>
        <a th:href="@{/admin/analytics}" th:class="${currentPage == 'analytics'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="bar-chart"></i></div>
            <div class="nav-text">Analytics</div>
        </a>

        <h6 class="section-title mt-3">More</h6>

        <a th:href="@{/admin/help}" th:class="${currentPage == 'help'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="help-circle"></i></div>
            <div class="nav-text">Help</div>
        </a>
        <a th:href="@{/admin/settings}" th:class="${currentPage == 'settings'} ? 'nav-item active' : 'nav-item'">
            <div class="nav-icon"><i data-feather="settings"></i></div>
            <div class="nav-text">Settings</div>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-profile">Administrator</div>
        </div>
    </div>

</div>

</body>
</html>
