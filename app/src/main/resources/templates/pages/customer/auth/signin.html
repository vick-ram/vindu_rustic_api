<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign In</title>
</head>
<body>
<div th:fragment="content">
    <form th:action="@{/auth/signin}" method="post" class="auth-form">
        <!-- Error message -->
        <div th:if="${error}" class="form-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Invalid credentials</span>
        </div>

        <!-- Email field -->
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" type="email" required
                   class="form-input"
                   placeholder="your@email.com">
        </div>

        <!-- Password field -->
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" required
                   class="form-input"
                   placeholder="••••••••">
            <div class="text-right">
                <a href="#" class="auth-link text-sm">Forgot password?</a>
            </div>
        </div>

        <!-- Remember me -->
        <div class="checkbox-group">
            <input id="remember-me" name="remember-me" type="checkbox" class="checkbox-input">
            <label for="remember-me" class="form-label">Remember me</label>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <!-- Social login -->
    <div class="social-divider">Or continue with</div>

    <div class="social-buttons">
        <button type="button" class="social-btn">
            <i class="fab fa-google social-icon google"></i>
        </button>
        <button type="button" class="social-btn">
            <i class="fab fa-github social-icon github"></i>
        </button>
    </div>
</div>
</body>
</html>
