<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="shipping">
    <form id="shippingForm" th:action="@{/checkout/shipping}" method="post" class="form-card">
        <input type="hidden" name="currentStep" th:value="${currentStep}">

        <div class="form-header">
            <h2 class="form-title">Shipping Information</h2>
            <p class="form-subtitle">Enter your shipping details</p>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-input" id="firstName"
                       name="firstName" th:value="${session.shippingInfo?.firstName}" required>
            </div>
            <div class="form-group">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-input" id="lastName"
                       name="lastName" th:value="${session.shippingInfo?.lastName}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-input" id="address"
                   name="address" th:value="${session.shippingInfo?.address}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-input" id="city"
                       name="city" th:value="${session.shippingInfo?.city}" required>
            </div>
            <div class="form-group">
                <label for="zipCode" class="form-label">ZIP Code</label>
                <input type="text" class="form-input" id="zipCode"
                       name="zipCode" th:value="${session.shippingInfo?.zipCode}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="country" class="form-label">Country</label>
            <select class="form-input" id="country" name="country">
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="UK">United Kingdom</option>
            </select>
        </div>
    </form>
</div>
</body>
</html>
