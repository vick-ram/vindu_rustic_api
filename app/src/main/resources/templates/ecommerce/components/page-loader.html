<th:block th:fragment="loader">
    <style>
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            z-index: 100000;
            pointer-events: none;
            transition: opacity 500ms;
        }

        .progress-inner {
            height: 100%;
            width: 0;
            transition: width 300ms ease-out;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent), var(--color-primary));
            background-size: 200% 100%;
            animation: progress-shimmer 2s linear infinite;
        }

        #page-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-background, #F9F6F0);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        #page-loader::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--color-overlay, rgba(0,0,0,0.02)));
            pointer-events: none;
        }

        .loader-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            z-index: 2;
        }

        .loader-icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--color-border, #D7C9B8);
            animation: loader-orbit-spin 3s linear infinite;
        }

        .loader-orbit-1 {
            width: 70px;
            height: 70px;
            border-top-color: var(--color-primary, #D98236);
            border-right-color: transparent;
            border-bottom-color: var(--color-accent, #E09A5D);
            border-left-color: transparent;
            animation: 2.5s;
        }

        .loader-orbit-2 {
            width: 85px;
            height: 85px;
            border-top-color: transparent;
            border-right-color: var(--color-accent, #E09A5D);
            border-bottom-color: transparent;
            border-left-color: var(--color-primary, #D98236);
            animation-duration: 4s;
            animation-direction: reverse;
        }

        .loader-core {
            position: relative;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-spinner-ring {
            width: 48px;
            height: 48px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: loader-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .loader-spinner-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-primary, #D98236);
            box-shadow: 0 0 12px var(--color-primary, #D98236);
            animation: loader-pulse 1.5s ease-in-out infinite;
        }

        .loader-brand {
            display: flex;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            animation: loader-fade-up 0.6s ease-out 0.2s both;
        }

        .loader-brand-text {
            color: var(--color-text, #3D2B1F);
        }

        .loader-brand-accent {
            background: linear-gradient(135deg,
            var(--color-primary, #D98236),
            var(--color-accent, #E09A5D));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Status text */
        .loader-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-text-secondary, #6D5446);
            animation: loader-fade-up 0.6s ease-out 0.4s both;
        }

        .loader-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-primary, #D98236);
            animation: loader-status-blink 1.5s ease-in-out infinite;
        }

        /* Decorative background elements */
        .loader-bg-element {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.1;
            filter: blur(60px);
        }

        .loader-bg-1 {
            width: 300px;
            height: 300px;
            background: var(--color-primary, #D98236);
            top: -100px;
            right: -100px;
            animation: loader-float 8s ease-in-out infinite;
        }

        .loader-bg-2 {
            width: 250px;
            height: 250px;
            background: var(--color-accent, #E09A5D);
            bottom: -80px;
            left: -80px;
            animation: loader-float 10s ease-in-out infinite reverse;
        }

        .loader-bg-3 {
            width: 200px;
            height: 200px;
            background: var(--color-secondary, #C49A6C);
            bottom: 20%;
            right: 20%;
            animation: loader-float 12s ease-in-out infinite;
        }

        /* Progress bar shimmer */
        @keyframes progress-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Spinner animations */
        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }

        @keyframes loader-orbit-spin {
            to { transform: rotate(360deg); }
        }

        @keyframes loader-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        @keyframes loader-status-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes loader-fade-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loader-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Dark mode adjustments */
        [data-theme="dark"] #page-loader {
            background: var(--color-dark-background, #17120E);
        }

        [data-theme="dark"] .loader-brand-text {
            color: var(--color-dark-text, #F3ECE7);
        }

        [data-theme="dark"] .loader-status {
            color: var(--color-dark-text-secondary, #CBBBB0);
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .loader-icon-wrapper {
                width: 64px;
                height: 64px;
            }

            .loader-orbit-1 {
                width: 56px;
                height: 56px;
            }

            .loader-orbit-2 {
                width: 68px;
                height: 68px;
            }

            .loader-spinner-ring {
                width: 40px;
                height: 40px;
            }

            .loader-brand {
                font-size: 1.25rem;
            }
        }
    </style>
    <!-- Top Progress Line -->
    <div id="page-progress-bar"
         class="progress-bar">
        <div id="page-progress-inner"
             class="progress-inner">
        </div>
    </div>

    <!-- Fullscreen Blur Overlay with Minimal Ring Spinner -->
    <div id="page-loader">
        <div class="loader-content">
            <!-- Animated Logo/Icon Container -->
            <div class="loader-icon-wrapper">
                <!-- Orbital rings -->
                <div class="loader-orbit loader-orbit-1"></div>
                <div class="loader-orbit loader-orbit-2"></div>

                <!-- Core spinner -->
                <div class="loader-core">
                    <div class="loader-spinner-ring"></div>
                    <div class="loader-spinner-dot"></div>
                </div>
            </div>

            <!-- Brand/Title with animated text -->
            <div class="loader-brand">
                <span class="loader-brand-text">Vindu</span>
                <span class="loader-brand-accent">Rustic</span>
            </div>

            <!-- Status text -->
            <p id="loader-title" class="loader-status">
                <span class="loader-status-dot"></span>
                <span id="loader-title-text">Loading</span>
            </p>
        </div>

        <!-- Decorative background elements -->
        <div class="loader-bg-element loader-bg-1"></div>
        <div class="loader-bg-element loader-bg-2"></div>
        <div class="loader-bg-element loader-bg-3"></div>
    </div>
</th:block>
