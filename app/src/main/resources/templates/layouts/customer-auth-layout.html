<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | My App'">Auth | My App</title>
    <link rel="stylesheet" href="/static/styles/auth.css">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 th:text="${title}">Auth</h1>
            <p class="auth-subtitle" th:text="${subtitle} ?: 'Welcome back! Please enter your details.'">
                Welcome back! Please enter your details.
            </p>
        </div>

        <!-- Content will be inserted here -->
        <div th:replace="${content}"></div>

        <div class="auth-footer">
            <div th:if="${#strings.equals(title, 'Sign In')}">
                Don't have an account? <a th:href="@{../pages/customer/auth/signup.html}" class="auth-link">Sign up</a>
            </div>
            <div th:if="${#strings.equals(title, 'Sign Up')}">
                Already have an account? <a th:href="@{../pages/customer/auth/signin.html}" class="auth-link">Sign in</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
