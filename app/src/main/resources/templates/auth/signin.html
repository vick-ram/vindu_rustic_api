<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth/index.html}">
<head>
    <meta charset="UTF-8">
    <title>Welcome Back!</title>
</head>
<body>
<div layout:fragment="auth-content">
    <div class="container flex">
        <div class="row justify-center">
            <div class="">
                <div class="card shadow-md border-0 rounded-md">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <h2 class="font-bold text-success">Welcome Back!</h2>
                            <p class="text-muted">Sign in to continue your journey with us</p>
                        </div>

                        <!-- Login Form -->
                        <form method="post" th:action="@{/signin}" class="mb-3">
                            <input type="hidden" name="redirectUrl" th:value="${redirectUrl}">
                            <div class="form-group">
                                <label for="email" class="label">Email</label>
                                <input type="text" class="py-2" id="email" name="email" required
                                       placeholder="Enter your email">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <div class="password-container">
                                    <input type="password" class="py-2" id="password" name="password" required
                                           placeholder="Enter your password">
                                    <button type="button" class="toggle-password"
                                            aria-label="Toggle password visibility">
                                        <i data-feather="eye"></i>
                                    </button>
                                </div>
                                <div class="text-end mt-2">
                                    <a th:href="@{/forgot-password}" class="text-decoration-none small">Forgot password?</a>
                                </div>
                            </div>
                            <button type="submit" class="btn w-full py-2 font-bold">
                                Sign In
                            </button>
                        </form>

                        <!-- Divider -->
                        <div class="w-full flex flex-row items-center gap-1 mt-1">
                            <hr class="flex-grow-1">
                            <div class="">OR</div>
                            <hr class="flex-grow-1">
                        </div>

                        <div class="social-login">
                            <a href="#" class="social-icon" title="Login with Google">
                                <i class="ti ti-brand-google"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Facebook">
                                <i class="ti ti-brand-facebook"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with X">
                                <i class="ti ti-brand-x"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Apple">
                                <i class="ti ti-apple"></i>
                            </a>
                        </div>
                        <!-- Sign Up Link -->
                        <div class="text-center mt-2">
                            <p class="text-muted">Don't have an account?
                                <a th:href="@{/signup}" class="text-decoration-none">Create one</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
