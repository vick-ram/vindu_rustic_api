<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth/index.html}">
<head>
    <title>Sign up</title>
</head>
<body>
<div layout:fragment="auth-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <!-- Login Form -->
                        <form method="post" th:action="@{/signup}">
                            <div class="form-group">
<!--                                Introduced First Name and LastName instead of just Name-->
                                <div class="flex row gap-3 items-center sm:column">
                                    <label for="firstName" class="form-label">First name</label>
                                    <input type="text" class="form-control py-2" id="firstName" name="firstName"
                                           placeholder="Enter your first name" required
                                           th:value="${formData.firstName}">
                                    <label for="lastName" class="form-label">Last name</label>
                                    <input type="text" class="form-control py-2" id="lastName" name="lastName"
                                           placeholder="Enter your last name" required
                                           th:value="${formData.lastName}">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="phoneNumber" class="form-label">Phone number</label>
                                <input type="tel" class="form-control py-2" id="phoneNumber" name="phoneNumber"
                                       placeholder="Enter your phone number"
                                       th:value="${formData.phoneNumber}">
                            </div>
                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control py-2" id="email" name="email"
                                       placeholder="Enter your email" required
                                       th:value="${formData.email}">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <div class="password-container">
                                    <input type="password" class="py-2" id="password" name="password" required
                                           placeholder="Enter your password">
                                    <button type="button" class="toggle-password"
                                            aria-label="Toggle password visibility">
                                        <i data-feather="eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn w-full py-2 rounded font-bold">
                                Sign Up
                            </button>
                        </form>

                        <!-- Divider -->
                        <div class="w-full flex flex-row items-center gap-1 mt-1">
                            <hr class="flex-grow-1">
                            <div class="">OR</div>
                            <hr class="flex-grow-1">
                        </div>

                        <div class="social-login">
                            <a href="#" class="social-icon" title="Login with Google">
                                <i class="ti ti-brand-google"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Facebook">
                                <i class="ti ti-brand-facebook"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Twitter">
                                <i class="ti ti-brand-x"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Apple">
                                <i class="ti ti-apple"></i>
                            </a>
                        </div>

                        <!-- Sign Up Link -->
                        <div class="text-center mt-2">
                            <p class="text-muted">Already have an account?
                                <a th:href="@{/signin}" class="text-primary fw-bold text-decoration-none">Login</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
