<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth/index.html}">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
</head>
<body>
<div layout:fragment="auth-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <!-- Login Form -->
                        <form method="post" th:action="@{/signup}">
                            <div class="form-group">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control py-2" id="name" name="name"
                                       placeholder="Enter your full name" required
                                       th:value="${formData.name}">
                            </div>
                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control py-2" id="email" name="email"
                                       placeholder="Enter your email" required
                                       th:value="${formData.email}">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <div class="password-container">
                                    <input type="password" class="py-2" id="password" name="password"
                                           placeholder="Enter your password">
                                    <button type="button" class="toggle-password"
                                            aria-label="Toggle password visibility">
                                        <i data-feather="eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Role Dropdown -->
                            <div class="mb-3">
                                <label for="roleId" class="form-label">Select Role</label>
                                <select class="form-select" id="roleId" name="roleId" required>
                                    <option value="">Choose a role...</option>
                                    <option th:each="role : ${roles}"
                                            th:value="${role.id}"
                                            th:text="${role.name}"
                                            th:selected="${formData.roleId == role.id}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn w-full py-2 rounded font-bold">
                                Sign Up
                            </button>
                        </form>

                        <!-- Divider -->
                        <div class="w-full flex flex-row items-center gap-1 mt-1">
                            <hr class="flex-grow-1">
                            <div class="">OR</div>
                            <hr class="flex-grow-1">
                        </div>

                        <div class="social-login">
                            <a href="#" class="social-icon" title="Login with Google">
                                <i class="ti ti-brand-google"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Facebook">
                                <i class="ti ti-brand-facebook"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Twitter">
                                <i class="ti ti-brand-x"></i>
                            </a>
                            <a href="#" class="social-icon" title="Login with Apple">
                                <i class="ti ti-apple"></i>
                            </a>
                        </div>

                        <!-- Sign Up Link -->
                        <div class="text-center mt-2">
                            <p class="text-muted">Already have an account?
                                <a th:href="@{/signin}" class="text-primary fw-bold text-decoration-none">Login</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
